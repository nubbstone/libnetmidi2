name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j

      - name: Test (conformance vectors + UDP loopback)
        run: ctest --test-dir build --build-config Release --output-on-failure

      # The README tabulates what each suite is worth, per-suite check counts
      # included. A stale count there is worse than no table, and nothing else here
      # would catch it -- the suites would still pass while the README misreported
      # them. Linux only: it re-runs the binaries, and once is enough.
      - name: README test table is not stale
        if: runner.os == 'Linux'
        run: ./tests/check_readme_counts.sh

  tools:
    name: tools build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    steps:
      - uses: actions/checkout@v4

      # nm2_cli carries an mDNS adapter over Bonjour. macOS has that in libSystem;
      # on Linux it comes from Avahi's compatibility layer. Installing it means the
      # real adapter is compiled on BOTH platforms -- otherwise Linux quietly takes
      # the no-mDNS fallback path and the adapter is only ever built on one OS.
      - name: Install Bonjour compatibility layer (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libavahi-compat-libdnssd-dev

      - name: Configure with tools enabled
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNETMIDI2_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build --config Release -j

      # Prove the Bonjour path was actually compiled in rather than silently falling
      # back. A link-time symbol is the right check here: a runtime one would depend
      # on a responder being alive on the runner, which is not something to make the
      # build depend on.
      - name: Confirm the mDNS adapter is present
        run: |
          if ! nm -u build/nm2_cli | grep -q DNSServiceBrowse; then
            echo "nm2_cli was built WITHOUT the Bonjour adapter"
            exit 1
          fi
          echo "Bonjour adapter linked in"

      # These need a peer on the network to do anything real, so CI can only check
      # that they start, parse arguments, and reject bad input. That still catches
      # the failure that actually happens: a tool nobody noticed had stopped
      # compiling, or one whose argument handling broke in a refactor.
      - name: Smoke test
        run: |
          ./build/nm2_cli --help > /dev/null
          echo "nm2_cli --help ok"

          if ./build/nm2_bench > /dev/null 2>&1; then
            echo "expected nm2_bench to exit non-zero when given no arguments"; exit 1
          fi
          echo "nm2_bench reports usage ok"

          if ./build/nm2_cli --connect 127.0.0.1:1 --chord "not a chord" > /dev/null 2>&1; then
            echo "expected a malformed --chord to be rejected"; exit 1
          fi
          echo "nm2_cli rejects bad input ok"

  freestanding:
    name: core compiles freestanding (no exceptions/RTTI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Protocol.h + Session.h with -fno-exceptions -fno-rtti
        run: |
          printf '#include <netmidi2/Session.h>\nint main(){ return 0; }\n' > /tmp/freestanding.cpp
          g++ -std=c++17 -fno-exceptions -fno-rtti -Wall -Wextra -Werror \
              -Iinclude /tmp/freestanding.cpp -o /tmp/freestanding
